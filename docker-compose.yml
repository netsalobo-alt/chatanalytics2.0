services:
  chatanalytics:
    container_name: chatanalytics
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - TZ=America/Belem
    volumes:
      # Volume persistente para banco de dados local e backups
      - chatanalytics_data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/api/config || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  chatanalytics_data:
    driver: local
